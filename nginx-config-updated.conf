    # ----------------------
    # Backend Novotel Tunis
    # ----------------------
server {
    listen 443 ssl;
    server_name api.novotel-tunis.com;

    ssl_certificate /etc/letsencrypt/live/api.novotel-tunis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.novotel-tunis.com/privkey.pem;

    # ⚠️ IMPORTANT : Permettre les uploads illimités (comme lacbackend)
    client_max_body_size 0;

    # Timeouts pour les uploads volumineux
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Headers CORS (comme lacbackend)
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;

    # Gérer les requêtes OPTIONS (preflight CORS)
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Headers proxy supplémentaires (comme lacbackend)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver le buffering pour les gros fichiers
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ----------------------
# Backend LAC
# ----------------------
server {
    listen 443 ssl;
    server_name lacbackend.novotel-tunis.com;

    ssl_certificate /etc/letsencrypt/live/lacbackend.novotel-tunis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacbackend.novotel-tunis.com/privkey.pem;

    client_max_body_size 0;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

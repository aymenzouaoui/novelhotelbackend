# Configuration Nginx pour api.novotel-tunis.com
# À placer dans /etc/nginx/sites-available/api.novotel-tunis.com
# Puis créer un lien symbolique : ln -s /etc/nginx/sites-available/api.novotel-tunis.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name api.novotel-tunis.com;

    # Redirection HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.novotel-tunis.com;

    # Certificats SSL (ajustez les chemins selon votre configuration)
    ssl_certificate /etc/letsencrypt/live/api.novotel-tunis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.novotel-tunis.com/privkey.pem;

    # ⚠️ IMPORTANT : Augmenter la limite de taille pour les uploads
    # Par défaut, Nginx limite à 1MB. Ici, on met 10GB (effectivement illimité)
    client_max_body_size 10G;
    
    # Timeout pour les uploads volumineux
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Headers pour CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Gérer les requêtes OPTIONS (preflight CORS)
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Proxy vers l'application Node.js (écoute sur localhost:5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings pour les gros fichiers
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Logs
    access_log /var/log/nginx/api.novotel-tunis.com.access.log;
    error_log /var/log/nginx/api.novotel-tunis.com.error.log;
}
